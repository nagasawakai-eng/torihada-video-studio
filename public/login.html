<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ログイン | TORIHADA 研修動画スタジオ</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    background: #f6f5f3;
  }
  .card {
    background: #fff;
    border: 1px solid #e4e1db;
    border-radius: 14px;
    padding: 40px;
    width: 320px;
    text-align: center;
  }
  h1 { font-size: 16px; margin: 0 0 6px; }
  p { font-size: 13px; color: #8a847a; margin: 0 0 24px; }
  #g_id_wrap { display: flex; justify-content: center; }
  .error { color: #d1453d; font-size: 12px; margin-top: 16px; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>TORIHADA 研修動画スタジオ</h1>
  <p>社内アカウント（@ドメイン限定）でログインしてください</p>
  <div id="g_id_wrap"></div>
  <div class="error" id="errorMsg"></div>
</div>

<script>
async function handleCredential(response) {
  const errorEl = document.getElementById('errorMsg');
  errorEl.style.display = 'none';
  try {
    const res = await fetch('/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ credential: response.credential }),
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.error || 'ログインに失敗しました');
    location.href = '/';
  } catch (e) {
    errorEl.textContent = e.message;
    errorEl.style.display = 'block';
  }
}

window.addEventListener('load', async () => {
  const { clientId } = await fetch('/auth/config').then(r => r.json());
  google.accounts.id.initialize({ client_id: clientId, callback: handleCredential });
  google.accounts.id.renderButton(document.getElementById('g_id_wrap'), { theme: 'outline', size: 'large', text: 'signin_with' });
});
</script>
</body>
</html>
