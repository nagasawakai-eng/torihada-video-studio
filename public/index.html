<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TORIHADA 研修動画スタジオ</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="app-header">
  <div>
    <h1>TORIHADA 研修動画スタジオ</h1>
    <div class="sub">台本を編集 → 音声で試聴 → MP4として書き出し</div>
  </div>
  <div id="userBox" hidden style="font-size:12px;color:var(--text-dim);align-items:center;gap:10px">
    <span id="userEmail"></span>
    <button id="logoutBtn" class="ghost">ログアウト</button>
  </div>
</header>

<div class="week-tabs" id="weekTabs"></div>

<div class="layout">
  <div class="slide-list" id="slideList"></div>

  <div class="editor-pane" id="editorPane">
    <div class="upload-box" id="uploadBox" style="display:none">
      この週の資料(PPTX)がまだ登録されていません。<br/>
      <input type="file" id="fileInput" accept=".pptx" style="margin-top:10px" />
    </div>
    <div id="slideEditor" style="display:none">
      <div class="preview-card">
        <img id="slideImg" src="" alt="slide preview" />
      </div>
      <div class="script-label">
        <span id="slideTitle">スライド</span>
      </div>
      <textarea class="script-input" id="scriptInput" placeholder="このスライドの台本を入力..."></textarea>
      <div class="editor-actions">
        <button class="primary" id="saveScriptBtn">台本を保存</button>
        <button id="previewAudioBtn">この台本を試聴</button>
        <audio id="previewAudioEl" style="display:none" controls></audio>
        <span id="editorStatus" class="status-msg"></span>
      </div>
    </div>
  </div>

  <div class="side-panel">
    <h2>音声・書き出し設定</h2>
    <div class="field">
      <label>読み上げボイス</label>
      <select id="voiceSelect"><option value="">既定のボイス</option></select>
    </div>
    <div class="field">
      <label>速度: <span id="speedVal">1.00</span></label>
      <input type="range" id="speedRange" min="0.7" max="1.3" step="0.01" value="1.0" />
    </div>
    <button class="primary" id="exportBtn" style="width:100%">全スライドをMP4で書き出す</button>
    <div class="progress-wrap" id="progressWrap" style="display:none">
      <div id="progressLabel">準備中...</div>
      <div class="progress-bar"><div id="progressBarInner"></div></div>
      <div class="status-msg" id="exportStatus"></div>
      <a id="downloadLink" href="#" style="display:none"><button class="primary" style="width:100%;margin-top:8px">MP4をダウンロード</button></a>
    </div>
    <h2 style="margin-top:24px">資料を差し替え</h2>
    <input type="file" id="replaceFileInput" accept=".pptx" />
    <div class="status-msg" id="replaceStatus"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
